<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>하이플래너 주간 시상 조회</title>
<style>
:root{--navy:#19365b;--blue:#245bc5;--bg:#f3f6fa;--line:#d8e0ea;--muted:#5e6b7b;--green:#176b50;--red:#a83232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1e293b;font:17px/1.55 system-ui,-apple-system,"Malgun Gothic",sans-serif}
main{max-width:700px;margin:auto;padding:24px 16px 40px}h1{font-size:clamp(27px,6vw,36px);line-height:1.2;margin:8px 0}
.sub{color:var(--muted);margin:0 0 8px}.asof{font-weight:800;color:var(--navy);margin:4px 0 0}.notice{font-size:15px;color:var(--red);margin:2px 0 22px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0}h2{font-size:21px;margin:0 0 14px}
.row{display:flex;gap:10px}input,button{font:inherit;min-height:56px;border-radius:12px}input{flex:1;min-width:0;padding:12px 14px;border:1px solid #aab7c7}
button{border:0;padding:12px 20px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e8edf4;color:var(--navy)}
.status{margin-top:12px;font-weight:650}.error{color:var(--red)}.success{color:var(--green)}.person{background:#eef4fc;padding:16px;border-radius:12px;margin-bottom:14px}
.person strong{font-size:26px;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}.label{color:var(--muted);font-size:15px}
.value{font-weight:800;font-size:clamp(18px,4vw,23px);overflow-wrap:anywhere}.payout{background:#eff8f3;border:1px solid #b9ddce;border-radius:14px;padding:18px;margin:16px 0}
.amount{font-size:clamp(29px,7vw,39px);font-weight:850;color:var(--green)}.note{font-size:14px;color:var(--muted)}table{width:100%;border-collapse:collapse}
th,td{padding:12px 6px;border-bottom:1px solid var(--line);text-align:left}th:last-child,td:last-child{text-align:right}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}
[hidden]{display:none!important}footer{font-size:13px;color:var(--muted);margin-top:18px}
@media(max-width:460px){main{padding:18px 12px}.card{padding:17px}.row,.actions{flex-direction:column}.row button,.actions button{width:100%}}
</style></head><body><main>
<div style="font-weight:800;color:var(--navy);font-size:14px">하이플래너 · WEEKLY AWARDS</div>
<h1>이번 주 시상 결과 확인</h1>
<p class="sub">본인 코드를 입력하면 실적과 시상품이 자동으로 표시돼요.</p>
<p class="asof">실적 기준 : 9월 23일 11시 기준</p>
<p class="notice">※ 취소·철회 제외 후 최종 평가됩니다.</p>
<section class="card"><h2>본인 코드 입력</h2><form id="form"><div class="row"><input id="code" inputmode="text" autocomplete="off" placeholder="하이플래너 코드 입력" aria-label="하이플래너 코드" required><button class="primary" type="submit">내 실적 조회</button></div></form><div id="msg" class="status" aria-live="polite"></div></section>
<section id="results" class="card" hidden><h2>내 실적 및 시상 결과</h2><div class="person">하이플래너 <strong id="name"></strong></div>
<div class="grid"><div class="metric"><div class="label">이번 주 인보험 실적</div><div class="value" id="insurance"></div></div>
<div class="metric"><div class="label">이번 주 하이캡 실적</div><div class="value" id="hiccap"></div></div>
<div class="metric"><div class="label">인보험 5만원 계약</div><div class="value" id="count5"></div></div>
<div class="metric"><div class="label">인보험 10만원 계약</div><div class="value" id="count10"></div></div></div>
<div class="payout"><div>기본시상금</div><div class="amount" id="base"></div><div id="rate" class="note"></div><div id="formula" class="note"></div><div id="eligibility" class="status"></div></div>
<h2>계약건별 시상품</h2><table><thead><tr><th>계약 구분</th><th>시상품</th><th>수량</th></tr></thead><tbody>
<tr><td>인보험 10만원</td><td>스팸+참치 세트</td><td id="gift10"></td></tr><tr><td>인보험 5만원</td><td>청정원 세트</td><td id="gift5"></td></tr></tbody></table>
<p id="giftTotal" style="font-weight:800"></p><div class="actions"><button id="reset" class="secondary" type="button">다시 조회하기</button></div></section>
<footer>실적 자료에 포함된 본인 코드로 조회하세요.</footer></main>

const $=id=>document.getElementById(id);
const won=n=>Math.round(Number(n)||0).toLocaleString('ko-KR')+'원';
function rateFor(h){if(h>=14000000)return 1;if(h>=10000000)return .9;if(h>=6000000)return .8;if(h>=4000000)return .7;if(h>=2000000)return .6;if(h>=1000000)return .4;return 0;}
function baseAward(ins,rate){return Math.floor((ins*rate)/1000)*1000;}
function err(t){$('msg').textContent=t;$('msg').className='status error';}
$('form').addEventListener('submit',e=>{e.preventDefault();$('results').hidden=true;const code=$('code').value.trim();
if(!code){err('본인 코드를 입력해주세요.');return;}
const found=DATA.filter(x=>x.code.toUpperCase()===code.toUpperCase());
if(!found.length){err('코드를 찾을 수 없습니다. 입력한 코드를 확인해주세요.');return;}
if(found.length>1){err('같은 코드가 여러 건 있습니다. 관리자에게 확인해주세요.');return;}
current=found[0];const rate=rateFor(current.hiccap),base=baseAward(current.insurance,rate),c5=current.count5,c10=current.count10;
$('name').textContent=current.name;$('insurance').textContent=won(current.insurance);$('hiccap').textContent=won(current.hiccap);
$('count5').textContent=c5+'건';$('count10').textContent=c10+'건';$('base').textContent=won(base);
$('rate').textContent='적용 지급률: '+Math.round(rate*100)+'%';
$('formula').textContent='계산식: '+Math.round(rate*100)+'% × '+won(current.insurance)+' → 1,000원 미만 절사 = '+won(base);
$('eligibility').textContent=rate===0?'이번 주는 기본시상 대상이 아니에요.':'기본시상 대상입니다.';
$('eligibility').className='status '+(rate===0?'error':'success');$('gift10').textContent=c10+'개';$('gift5').textContent=c5+'개';

$('msg').textContent='조회가 완료됐어요.';$('msg').className='status success';$('results').hidden=false;});
$('reset').addEventListener('click',()=>{$('code').value='';$('msg').textContent='';$('results').hidden=true;current=null;$('code').focus();});
</script></body></html>
